name: One-time Format Fix

on:
  push:
    branches: [refactor/template-alignment]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix indentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/context/UserContext.tsx')
          text = p.read_text()
          old = "    isActive: apiUser.is_active !== false,\n      myTasks: workspace.myTasks,"
          if old not in text:
              raise RuntimeError('target not found')
          p.write_text(text.replace(old, "    isActive: apiUser.is_active !== false,\n    myTasks: workspace.myTasks,"))
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/one-time-format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: 修正 UserContext 缩进 [skip ci]"
          git push origin HEAD:refactor/template-alignment
