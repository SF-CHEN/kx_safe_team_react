name: Strict Task Creation Input

on:
  push:
    branches:
      - refactor/template-alignment

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard marker
        id: guard
        run: |
          if [ "$(git log -1 --pretty=%s)" = "chore: tighten task creation input" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply guarded patch
        if: steps.guard.outputs.run == 'true'
        run: node script/strict-task-creation-input.cjs

      - name: Commit patch
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/TaskCreationModal.tsx
          git commit -m "refactor: 收紧评测任务创建输入类型 [skip ci]"
          git push origin HEAD:refactor/template-alignment
