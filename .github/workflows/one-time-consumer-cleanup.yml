name: One-time Consumer Cleanup

on:
  push:
    branches:
      - refactor/template-alignment

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update consumers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise RuntimeError(f'pattern not found: {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'src/pages/AdminDashboard.tsx',
              "const next = await login(account.trim(), password, true);",
              "const next = await login(account.trim(), password);",
          )

          layout = 'src/components/Layout.tsx'
          replace(
              layout,
              "  const { user, isGuest, logout, unreadCount, updateAccount, changePassword } = useUser();",
              "  const { user, isGuest, logout, unreadCount, updateAccount } = useUser();",
          )
          replace(
              layout,
              "  ArrowRight, Menu, Bell, UserRound, LockKeyhole, AtSign, Save\n",
              "  ArrowRight, Menu, Bell, UserRound, AtSign, Save\n",
          )
          replace(layout, "  const [currentPassword, setCurrentPassword] = useState('');\n", "")
          replace(layout, "  const [newPassword, setNewPassword] = useState('');\n", "")
          replace(layout, "  const [confirmPassword, setConfirmPassword] = useState('');\n", "")
          replace(
              layout,
              "    setCurrentPassword('');\n    setNewPassword('');\n    setConfirmPassword('');\n",
              "",
          )
          replace(
              layout,
              "  const saveNewPassword = async () => {\n    if (!currentPassword || !newPassword || !confirmPassword) return toast.error('请完整填写密码信息');\n    if (newPassword !== confirmPassword) return toast.error('两次输入的新密码不一致');\n    setAccountSaving(true);\n    const result = await changePassword(currentPassword, newPassword);\n    setAccountSaving(false);\n    if (!result.ok) return toast.error(result.message || '密码修改失败');\n    setCurrentPassword('');\n    setNewPassword('');\n    setConfirmPassword('');\n    toast.success('密码修改成功，下次登录请使用新密码');\n  };\n\n",
              "",
          )
          replace(
              layout,
              "            <section className=\"space-y-4 border-t pt-6\">\n              <div className=\"flex items-center gap-2 text-sm font-black text-slate-900\"><LockKeyhole className=\"h-4 w-4 text-blue-600\" />修改密码</div>\n              <div className=\"grid gap-3 sm:grid-cols-3\"><input type=\"password\" value={currentPassword} onChange={event => setCurrentPassword(event.target.value)} placeholder=\"当前密码\" autoComplete=\"current-password\" className=\"h-11 rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-blue-500\" /><input type=\"password\" value={newPassword} onChange={event => setNewPassword(event.target.value)} placeholder=\"新密码（至少6位）\" autoComplete=\"new-password\" className=\"h-11 rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-blue-500\" /><input type=\"password\" value={confirmPassword} onChange={event => setConfirmPassword(event.target.value)} placeholder=\"再次输入新密码\" autoComplete=\"new-password\" className=\"h-11 rounded-xl border border-slate-200 px-3 text-sm outline-none focus:border-blue-500\" /></div>\n              <div className=\"flex items-center justify-between gap-4\"><p className=\"text-xs leading-5 text-slate-400\">演示版使用浏览器本地加密摘要保存；正式环境需由后端完成身份校验、密码加密和安全审计。</p><Button variant=\"outline\" onClick={saveNewPassword} disabled={accountSaving} className=\"shrink-0\">修改密码</Button></div>\n            </section>\n",
              "",
          )
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/one-time-consumer-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: 清理鉴权旧消费者 [skip ci]"
          git pull --rebase origin refactor/template-alignment
          git push origin HEAD:refactor/template-alignment
