name: Template Alignment Autofix

on:
  push:
    branches:
      - refactor/template-alignment

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply template alignment patch set'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded patches
        run: node script/template-alignment-patch.cjs

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --exit-code && exit 0
          git commit -m "fix: 收口迁移遗留类型与假数据逻辑 [skip ci]"
          git push origin HEAD:refactor/template-alignment
