name: Fix Moved Relative Imports

on:
  push:
    branches:
      - refactor/template-alignment

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard marker
        id: guard
        run: |
          if [ "$(git log -1 --pretty=%s)" = "chore: fix moved relative imports" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fix unresolved moved imports
        if: steps.guard.outputs.run == 'true'
        run: node script/fix-moved-relative-imports.cjs

      - name: Commit fixes
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No moved relative imports needed fixing."
            exit 0
          fi
          git commit -m "fix: 修复目录迁移后的相对资源路径 [skip ci]"
          git push origin HEAD:refactor/template-alignment
