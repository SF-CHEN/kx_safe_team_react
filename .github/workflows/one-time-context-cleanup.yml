name: One-time Context Cleanup

on:
  push:
    branches: [refactor/template-alignment]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: 执行 Context 最终清理'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cleanup UserContext
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/context/UserContext.tsx')
          text = path.read_text()
          replacements = [
              ("    | '深度模型可信评测'\n", "    | '深度模型可信测评'\n"),
              ("  logout: () => Promise<void>\n", "  logout: () => void\n"),
              ("  changePassword: (\n    currentPassword: string,\n    newPassword: string,\n  ) => Promise<{ ok: boolean; message?: string }>\n", ""),
              ("  const logout = async () => {\n    clearSession()\n  }\n", "  const logout = () => {\n    clearSession()\n  }\n"),
              ("  const changePassword = async (_currentPassword: string, newPassword: string) => {\n    if (newPassword.length < 6) return { ok: false, message: '新密码至少需要 6 位' }\n    return { ok: false, message: '密码修改接口尚未开放，请联系管理员' }\n  }\n\n", ""),
              ("        changePassword,\n", ""),
          ]
          for old, new in replacements:
              if old not in text:
                  raise RuntimeError(f'pattern not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/one-time-context-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: 删除 UserContext 无效能力 [skip ci]"
          git pull --rebase origin refactor/template-alignment
          git push origin HEAD:refactor/template-alignment
