name: One-time User Context Cleanup

on:
  push:
    branches: [refactor/template-alignment]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove compatibility code
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise RuntimeError(f'pattern not found: {path}\n{old[:120]}')
              p.write_text(text.replace(old, new))

          user = 'src/context/UserContext.tsx'
          replace(user, """/** @deprecated 正式模型统一从后端 depth-model 获取；仅保留旧页面类型兼容。 */\nexport interface MyModel {\n  id: string\n  name: string\n  type: '开源' | '闭源' | '自定义'\n  apiBase: string\n  modelId: string\n  createdAt: string\n}\n\n""", '')
          replace(user, """  /** @deprecated 正式模型不再写入 UserContext。 */\n  myModels: MyModel[]\n""", '')
          replace(user, """  /** @deprecated 正式模型保存请调用 src/api/model。 */\n  addModel: (model: MyModel) => void\n""", '')
          replace(user, """  myModels: [],\n""", '')
          replace(user, """      // 正式模型已经有后端数据源，不再把 myModels 写入浏览器形成第二份数据库。\n""", '')
          replace(user, """function isFormalServerTaskId(id: string) {\n  return id.startsWith('evaluation:') || id.startsWith('master:')\n}\n\n""", '')
          replace(user, """/** 主站登录走后端鉴权，本地凭证重置仅用于原型联调占位。 */\nexport async function adminResetLocalPassword(_userId: string, _password: string): Promise<boolean> {\n  return false\n}\n\n""", '')
          replace(user, """        .filter((item) => !known.has(item.id) && !isFormalServerTaskId(item.id))\n""", """        .filter((item) => !known.has(item.id))\n""")
          replace(user, """    upsertPlatformUser({ id: next.id, name: next.name, contact: next.email || account })\n""", """    upsertPlatformUser({\n      id: next.id,\n      name: next.name,\n      contact: next.email || account,\n      role: next.role === 'admin' ? 'admin' : 'user',\n    })\n""")
          replace(user, """    upsertPlatformUser({ id: next.id, name: next.name, contact: next.email || username })\n""", """    upsertPlatformUser({\n      id: next.id,\n      name: next.name,\n      contact: next.email || username,\n      role: next.role === 'admin' ? 'admin' : 'user',\n    })\n""")
          replace(user, """    upsertPlatformUser({ id: user.id, name, contact: email })\n""", """    upsertPlatformUser({\n      id: user.id,\n      name,\n      contact: email,\n      role: user.role === 'admin' ? 'admin' : 'user',\n    })\n""")
          replace(user, """  const addTask = (task: EvalTask) => {\n    // 正式任务已经由后端 + Query 管理；兼容调用到这里时直接忽略，避免再次写 localStorage/workflowStore。\n    if (isFormalServerTaskId(task.id)) return\n\n""", """  const addTask = (task: EvalTask) => {\n""")
          replace(user, """  const updateTask = (id: string, updates: Partial<EvalTask>) => {\n    if (isFormalServerTaskId(id)) return\n""", """  const updateTask = (id: string, updates: Partial<EvalTask>) => {\n""")
          replace(user, """  const deleteTask = (id: string) => {\n    if (isFormalServerTaskId(id)) return\n""", """  const deleteTask = (id: string) => {\n""")
          replace(user, """  const addModel = (_model: MyModel) => {\n    // 正式模型已有 depth-model 后端接口；旧调用保留为 no-op，避免模型保存失败后仍出现本地“已保存”记录。\n  }\n\n""", '')
          replace(user, """        addModel,\n""", '')

          store = 'src/data/workflowStore.ts'
          replace(store, """  /** 管理端展示所需的归一化角色；旧本地记录缺失时按普通用户处理。 */\n  role?: 'admin' | 'user';\n""", """  role: 'admin' | 'user';\n""")
          replace(store, """function normalizeStatus(status: string): WorkflowStatus {\n  const aliases: Record<string, WorkflowStatus> = {\n    待受理: '处理中', 材料核验: '处理中', 待交付: '处理中', 材料已接收: '处理中',\n    待补充材料: '待用户补充', 已推送: '已交付', 处理异常: '处理中', 评测中: '处理中', 排队中: '处理中',\n  };\n  if (aliases[status]) return aliases[status];\n  if (status === '处理中' || status === '待用户补充' || status === '已交付' || status === '已终止') return status;\n  return '处理中';\n}\n\nfunction normalizeTask(task: WorkflowTask): WorkflowTask {\n  const normalized = normalizeStatus(String(task.status));\n  return {\n    ...task,\n    product: task.product === '模型数据安全评测' ? '数据集安全评测' : task.product,\n    status: normalized,\n    communications: task.communications || [],\n    publicMessage: task.publicMessage || (String(task.status) === '处理异常' ? '任务处理遇到异常，管理员正在核实。' : undefined),\n  };\n}\n""", """function normalizeTask(task: WorkflowTask): WorkflowTask {\n  return { ...task, communications: task.communications || [] };\n}\n""")
          replace(store, """export const getPlatformUsers = (): PlatformUserRecord[] => read<PlatformUserRecord>(USERS_KEY).map((user) => ({ ...user, role: user.role || 'user' }));\n""", """export const getPlatformUsers = (): PlatformUserRecord[] => read<PlatformUserRecord>(USERS_KEY);\n""")
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/one-time-user-context-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: 删除 UserContext 历史兼容代码 [skip ci]"
          git pull --rebase origin refactor/template-alignment
          git push origin HEAD:refactor/template-alignment
