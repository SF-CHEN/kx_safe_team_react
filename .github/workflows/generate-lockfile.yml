name: Generate npm Lockfile

on:
  push:
    branches:
      - refactor/template-alignment

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard marker
        id: guard
        run: |
          if [ "$(git log -1 --pretty=%s)" = "chore: generate npm lockfile" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package-lock.json
        if: steps.guard.outputs.run == 'true'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date."
            exit 0
          fi
          git commit -m "chore: 生成 npm 锁文件 [skip ci]"
          git pull --rebase origin refactor/template-alignment
          git push origin HEAD:refactor/template-alignment
