name: One-time Task Consumer Cleanup

on:
  push:
    branches: [refactor/template-alignment]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove task compatibility consumers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if text.count(old) < count:
                  raise RuntimeError(f'pattern not found: {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count))

          replace('src/components/AigcTaskModal.tsx', "      status: '排队中',", "      status: '处理中',")
          replace('src/components/PrivacyAuditTaskModal.tsx', "      status: '排队中',", "      status: '处理中',")
          replace(
              'src/components/TrainingEvalModal.tsx',
              "      status: pricingPlan === 'free' ? '排队中' : '评测中',",
              "      status: '处理中',",
          )

          task_modal = 'src/components/TaskCreationModal.tsx'
          replace(task_modal, "import { useUser, EvalTask } from '../context/UserContext';", "import { useUser } from '../context/UserContext';")
          replace(
              task_modal,
              "  const resolveEvalType = (): EvalTask['evalType'] => {\n    if (pageType === 'llm') return '大模型评测';\n    return taskType === 'multimodal' ? '多模态大模型安全评测' : '大模型安全评测';\n  };\n\n",
              "",
          )

          resource = 'src/pages/ResourceCenter.tsx'
          replace(
              resource,
              "import type {\n  EvaluationTaskMasterProductType,\n  EvaluationTaskMasterStatus,\n} from '@/api/evaluation/taskMeta';",
              "import {\n  mapProductFilterToMaster,\n  mapStatusFilterToMaster,\n} from '@/api/evaluation/taskMeta';",
          )
          replace(
              resource,
              "function productLabel(type: EvalTask['evalType']) {\n  if (type === '大模型评测') return '大模型性能评测';\n  if (type === '多模态大模型安全评测') return '大模型安全评测';\n  if (type === '模型数据安全评测') return '数据集安全评测';\n  return type;\n}\n\n",
              "",
          )
          replace(
              resource,
              "function productTypeFromLabel(product: string): EvaluationTaskMasterProductType | undefined {\n  if (product === '数据集安全评测' || product === '模型数据安全评测') return 'DATA_SAFETY';\n  if (product === '深度模型可信测评') return 'TRUST';\n  if (product === '大模型性能评测') return 'PERFORMANCE';\n  if (product === '大模型安全评测') return 'SAFETY';\n  if (product === '智能体安全评测') return 'AGENT_SAFETY';\n  return undefined;\n}\n\nfunction statusFromLabel(status: string): EvaluationTaskMasterStatus | undefined {\n  if (status === '处理中') return 'PROCESSING';\n  if (status === '待用户补充') return 'AWAIT_SUPPLEMENT';\n  if (status === '已交付') return 'DELIVERED';\n  if (status === '已终止') return 'TERMINATED';\n  return undefined;\n}\n\n",
              "",
          )
          replace(resource, "    productType: productTypeFromLabel(product),", "    productType: mapProductFilterToMaster(product),")
          replace(resource, "    status: statusFromLabel(status),", "    status: mapStatusFilterToMaster(status),")
          replace(resource, "    status: row.status as EvalTask['status'],", "    status: row.status,")
          replace(resource, "{productLabel(task.evalType)}", "{task.evalType}", count=2)
          replace(resource, "  const rawStatus = String(task.status);", "  const rawStatus = task.status;")
          replace(
              resource,
              "  const messageTone = rawStatus === '待用户补充' || rawStatus === '待补充材料'\n",
              "  const messageTone = rawStatus === '待用户补充'\n",
          )
          replace(resource, "      {(rawStatus === '待用户补充' || rawStatus === '待补充材料') && (", "      {rawStatus === '待用户补充' && (")
          replace(resource, "        {(rawStatus === '已交付' || rawStatus === '已推送') && task.reports?.length ? (", "        {rawStatus === '已交付' && task.reports?.length ? (")
          replace(
              resource,
              "      {rawStatus === '处理异常' && !task.publicMessage && (\n        <div className=\"rounded-xl bg-red-50 p-4 text-sm text-red-700\">\n          <MessageSquare className=\"mr-2 inline h-4 w-4\" />\n          任务处理出现异常，请通过玄鉴智能助手联系技术顾问。\n        </div>\n      )}\n",
              "",
          )

          admin = 'src/components/AdminWorkflowWorkbench.tsx'
          replace(
              admin,
              "export function normalizeAdminStatus(status: string): WorkflowStatus {\n  const upper = status.trim().toUpperCase();\n  if (status === '待用户补充' || upper === 'AWAIT_SUPPLEMENT') return '待用户补充';\n  if (status === '已交付' || upper === 'DELIVERED') return '已交付';\n  if (status === '已终止' || upper === 'TERMINATED') return '已终止';\n  return '处理中';\n}\n\n",
              "",
          )
          replace(
              admin,
              "function canonicalProduct(product: string) {\n  if (product === '大模型评测') return '大模型性能评测';\n  if (product === '多模态大模型安全评测') return '大模型安全评测';\n  if (product === '模型数据安全评测') return '数据集安全评测';\n  return product;\n}\n\n",
              "",
          )
          replace(admin, "    status: normalizeAdminStatus(row.status),", "    status: row.status,")
          replace(admin, "    status: detail ? normalizeAdminStatus(detail.status) : task.status,", "    status: detail?.status || task.status,")
          replace(admin, "  const normalizedStatus = normalizeAdminStatus(displayStatus);", "  const normalizedStatus = displayStatus;")
          replace(admin, "                  ? normalizeAdminStatus(selectedDetail.status)\n", "                  ? selectedDetail.status\n")
          replace(admin, "{task.userName} · {canonicalProduct(task.product)}", "{task.userName} · {task.product}")
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/one-time-task-consumer-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: 删除任务旧状态与旧产品消费者 [skip ci]"
          git pull --rebase origin refactor/template-alignment
          git push origin HEAD:refactor/template-alignment
