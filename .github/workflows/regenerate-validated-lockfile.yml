name: Regenerate Validated npm Lockfile

on:
  push:
    branches:
      - refactor/template-alignment

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard marker
        id: guard
        run: |
          if [ "$(git log -1 --pretty=%s)" = "chore: regenerate validated npm lockfile" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate lockfile from clean state
        if: steps.guard.outputs.run == 'true'
        run: |
          rm -rf node_modules package-lock.json
          npm install --ignore-scripts --no-audit --no-fund
          # npm 10 can emit an incomplete nested dependency tree on the first install;
          # a second install normalizes the freshly generated lock before npm ci validates it.
          npm install --ignore-scripts --no-audit --no-fund

      - name: Validate with npm ci
        if: steps.guard.outputs.run == 'true'
        run: |
          rm -rf node_modules
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit validated lockfile
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Validated package-lock.json has no changes."
            exit 0
          fi
          git commit -m "chore: 重新生成并验证 npm 锁文件 [skip ci]"
          git pull --rebase origin refactor/template-alignment
          git push origin HEAD:refactor/template-alignment
