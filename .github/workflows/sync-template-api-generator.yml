name: Sync Template API Generator

on:
  push:
    branches:
      - refactor/template-alignment

permissions:
  contents: write

jobs:
  sync-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard marker
        id: guard
        run: |
          if [ "$(git log -1 --pretty=%s)" = "chore: sync template api generator" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync generator scripts from template
        if: steps.guard.outputs.run == 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/SF-CHEN/react-ai-template/main/script/generate-api.cjs -o script/generate-api.cjs
          curl -fsSL https://raw.githubusercontent.com/SF-CHEN/react-ai-template/main/script/load-swagger.cjs -o script/load-swagger.cjs
          curl -fsSL https://raw.githubusercontent.com/SF-CHEN/react-ai-template/main/script/sync-options.cjs -o script/sync-options.cjs
          curl -fsSL https://raw.githubusercontent.com/SF-CHEN/react-ai-template/main/script/option-label-overrides.cjs -o script/option-label-overrides.cjs
          curl -fsSL https://raw.githubusercontent.com/SF-CHEN/react-ai-template/main/script/README.md -o script/README.md

      - name: Generate API from cached OpenAPI
        if: steps.guard.outputs.run == 'true'
        run: npm run api:generate -- --file script/api.json

      - name: Commit generated API
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script/generate-api.cjs script/load-swagger.cjs script/sync-options.cjs script/option-label-overrides.cjs script/README.md src/api/generated
          git commit -m "refactor: 使用模板脚本生成业务 API [skip ci]"
          git pull --rebase origin refactor/template-alignment
          git push origin HEAD:refactor/template-alignment
